[project]
name = "eva-font-registry"
version = "0.1.0"
description = "License-gated font inventory and webfont release pipeline powered by FontTools and FontBakery."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eva Inc." }]
dependencies = [
  "fonttools[woff]>=4.59,<5",
  "fontbakery>=0.13,<1",
]

[project.scripts]
eva-font = "eva_font_registry.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eva_font_registry"]

[tool.ruff]
line-length = 110
target-version = "py311"
